<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Projeto simples de cadastro e listagem de produtos" />

    <link rel="stylesheet" href="assets/css/style.css" />
    <link rel="shortcut icon" href="form-icon.ico" type="image/x-icon" />

    <title>Cadastro e Listagem de Produtos</title>
  </head>
  <body>
    <div id="projeto">
      <section id="secao-form" class="hidden">
        <h1>Cadastro de Produto</h1>
        <form id="form-produtos" method="post" autocomplete="off">
          <div>
            <label for="inome">Nome do Produto</label>
            <input type="text" name="nome" id="inome" for="inome" placeholder="Digite o nome do produto:" min="5" maxlength="15" required />

            <label for="idesc">Descrição do Produto</label>
            <input type="text" name="desc" id="idesc" for="idesc" placeholder="Descreva o produto:" minlength="5" maxlength="100" required />

            <label for="ivalor">Valor do Produto</label>
            <input type="number" name="valor" id="ivalor" for="ivalor" placeholder="Digite o valor do produto:" min="0" step="0.01" required />
          </div>
          <div>
            <label>Disponível para Venda?</label>
            <label> <input type="radio" name="opcao" id="isim" for="idisp" value="Sim" required /> Sim</label>
            <label> <input type="radio" name="opcao" id="inao" for="idisp" value="Não" /> Não</label>
          </div>
          <button type="submit">Cadastrar Produto</button>
        </form>
      </section>

      <section id="secao-lista">
        <h1>Listagem de Produtos</h1>
        <button id="botao-novo-produto">Cadastrar Novo Produto</button>
        <button id="botao-limpar-lista">Limpar Listagem</button>
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Valor</th>
            </tr>
          </thead>
          <tbody id="lista-produtos"></tbody>
        </table>
      </section>
    </div>
    <script src="assets/js/script.js"></script>
  </body>
</html>
